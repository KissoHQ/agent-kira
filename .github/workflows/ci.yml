# Checks every pull request and every push to main: lint, types, format, tests against a real
# database and mail server, the audit of the dependencies, the build of the agent server, and the
# build of the two images of the deployment, which are not pushed anywhere.
# Actions are pinned by the commit of their release, so a moved tag cannot change what runs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # The same image as compose.yaml, pinned by digest.
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
        env:
          POSTGRES_USER: request_agent
          POSTGRES_DB: request_agent
          POSTGRES_PASSWORD: ci-owner-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U request_agent -d request_agent"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mail:
        # The local mail server of the tests, as in compose.yaml.
        image: greenmail/standalone:2.1.15@sha256:309ba544ea482e5d4265d09921cdab07c8dad2cc4481d715c9b8ff5d3f0a149f
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=agent:ci-mail-password@requests.example,agent-test:ci-mail-test-password@requests.example
        ports:
          - 3025:3025
          - 3143:3143
    # Passwords of disposable containers, used only by this job.
    env:
      TEST_DATABASE_URL: postgresql://request_agent:ci-owner-password@127.0.0.1:5433/request_agent_test
      APP_DATABASE_URL: postgresql://request_agent_app:ci-app-password@127.0.0.1:5433/request_agent
      SERVER_DATABASE_URL: postgresql://request_agent_server:ci-server-password@127.0.0.1:5433/request_agent
      TEST_EMAIL_USER: agent-test
      TEST_EMAIL_PASSWORD: ci-mail-test-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm, at the version of package.json
        run: npm install --global pnpm@12.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Format
        run: pnpm format:check
      - name: Tests
        run: pnpm test
      - name: Audit of the dependencies
        run: pnpm audit
      - name: Build of the agent server
        run: pnpm build
      - name: Build of the agent server image
        run: docker build --target server --tag kira-server:ci .
      - name: Build of the web interface image
        run: docker build --target web --tag kira-web:ci .
