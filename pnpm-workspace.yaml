packages:
  - "apps/*"
  - "packages/*"
  # The agent with a scripted model, which the tests build and start.
  - "apps/agent/test/scripted"

# Every dependency version is declared once in the catalog and shared by all packages.
catalogMode: strict
saveExact: true
engineStrict: true

# Dependencies allowed to run install scripts, after review.
allowBuilds:
  esbuild: true

catalog:
  "@hono/node-server": 2.1.8
  "@mastra/core": 1.83.0
  "@slack/socket-mode": 3.1.0
  "@slack/web-api": 8.2.0
  "@types/node": 26.6.5
  "@types/pg": 8.23.1
  # The version the tests of eve 1.5.0 run with; eve needs at least 7.0.172.
  ai: 7.0.177
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  email-reply-parser: 2.3.9
  eve: 1.5.0
  hono: 4.13.18
  imapflow: 2.9.1
  mastra: 1.39.0
  nodemailer: 10.2.1
  ollama-ai-provider-v2: 4.1.0
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2005
  pg: 8.23.1
  postal-mime: 4.1.4
  prettier: 3.9.10
  typescript: 7.0.2
  vitest: 4.1.12
  zod: 4.6.7

overrides:
  # drizzle-kit declares @esbuild-kit/esm-loader but never loads it. Its esbuild 0.18 is flagged by
  # GHSA-67mh-4wv8-2f99, so it gets the version drizzle-kit itself runs.
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  # The Mastra deployer bundles @hono/node-server into the built server. 1.83.0 bundles 2.1.6, the
  # first version fixed for GHSA-jpvv-r467-5p4w and GHSA-qv5m-9pm6-hqp3; the CLI would take the
  # newest 1.x, so it is pinned to the version matching @mastra/core.
  "mastra>@mastra/deployer": 1.83.0
  # The archiver of the Mastra CLI pulls minimatch 10, flagged by GHSA-g3hv-75wg-m249 until 11.0.1.
  # readdir-glob only uses the Minimatch class, unchanged in 11.
  "readdir-glob>minimatch": 11.0.8

peerDependencyRules:
  allowedVersions:
    # The WebSocket helper of the Mastra deployer asks for @hono/node-server 1.x as a peer
    # dependency, which it never imports. It shares the 2.x of the agent server instead, so no copy
    # of 1.x, which has no fix for GHSA-rmxm-3fg6-px4f, is installed.
    "@hono/node-ws>@hono/node-server": "2"
